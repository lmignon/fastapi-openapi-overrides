---
# Release a new version of the library:
# - compute the new version from the latest tag and the requested bump;
# - update the changelog from the news fragments (towncrier);
# - commit the changelog and tag the release (the version of the package is
#   computed from the tag by hatch-vcs);
# - build and publish the package to PyPI;
# - create the GitHub release with the changelog of the version as notes.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to increase (major.minor.patch)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update the changelog and tag the release
    # releases are only made from the default branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # the release must be approved before anything is pushed (required
    # reviewers of the environment). The "release" environment of the pypi job
    # can't be used here: it would require a second approval.
    environment: release-approval
    permissions:
      # push the changelog and the tag
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the tags are required to compute the version
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo "0.0.0")
          version=$(python3 - "$latest" "$BUMP" <<'EOF'
          import sys

          major, minor, patch = (int(part) for part in sys.argv[1].split("."))
          bump = sys.argv[2]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          EOF
          )
          echo "Releasing $version (latest release: $latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that there is something to release
        run: |
          if [ -z "$(find news -type f ! -name .gitignore)" ]; then
            echo "::error::No news fragment found into the news directory"
            exit 1
          fi

      - name: Update the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uvx towncrier build --yes --version "$VERSION"

      - name: Extract the release notes
        run: |
          uv run --no-project --with pypandoc-binary python - <<'EOF'
          import os
          import re
          from pathlib import Path

          import pypandoc

          lines = Path("HISTORY.rst").read_text().splitlines()
          # the changelog starts with the section of the new version: skip its
          # title and stop at the title of the previous version
          section = []
          for line in lines[2:]:
              if re.match(r"^\d+\.\d+\.\d+ \(", line):
                  break
              section.append(line)
          notes = pypandoc.convert_text("\n".join(section), "gfm", format="rst")
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(notes)
          print(notes)
          EOF

      - name: Commit the changelog and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$VERSION"

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          # the version computed from the tag must be the released one
          ls dist/*-"$VERSION"-*.whl dist/*-"$VERSION".tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  pypi:
    name: Publish the package to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/fastapi-openapi-overrides/${{ needs.prepare.outputs.version }}/
    permissions:
      # authenticate to PyPI via OIDC (trusted publishing)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file artifacts/notes/notes.md \
            --verify-tag
