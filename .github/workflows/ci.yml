---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --group typing mypy src

  tests:
    name: "Python ${{ matrix.python-version }} - fastapi ${{ matrix.fastapi-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # the minimal supported version of fastapi, and the latest versions of
        # all the dependencies (as installed by the users of the library)
        fastapi-version: ["0.138.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select the version of fastapi
        env:
          FASTAPI_VERSION: ${{ matrix.fastapi-version }}
        run: |
          if [ "$FASTAPI_VERSION" = "latest" ]; then
            # the latest versions of all the dependencies
            uv lock --upgrade
          else
            uv lock --upgrade-package "fastapi==$FASTAPI_VERSION"
          fi
      - name: Show the tested versions
        run: uv tree --depth 2
      - name: Run tests
        run: |
          uv run --group test coverage run -m pytest
          uv run --group test coverage xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          flags: unittests # optional
