[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-openapi-overrides"
description = "Document the dependency overrides of a FastAPI application into its OpenAPI schema."
authors = [{name = "Laurent Mignon", email = "laurent.mignon@acsone.eu"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    # route contexts are available since fastapi 0.138
    "fastapi>=0.138",
]

[project.urls]
Source = "https://github.com/lmignon/fastapi-openapi-overrides"

[dependency-groups]
test = [
    "pytest",
    "coverage[toml]",
    "httpx",
]
typing = [
    "mypy",
]

[tool.hatch.version]
path = "src/fastapi_openapi_overrides/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_openapi_overrides"]

[tool.coverage.run]
branch = true
source_pkgs = ["fastapi_openapi_overrides"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

[tool.mypy]
strict = true

[tool.ruff]
# keep the examples of the documentation as written (e.g. the "#>" outputs)
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# fastapi parameters are declared as default values
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Security",
]
